- type: entity
  id: DepartmentRewardConsoleBase
  parent: BaseComputer
  abstract: true
  name: ent-DepartmentRewardConsoleBase
  description: ent-DepartmentRewardConsoleBase.desc
  components:
  - type: ActivatableUI
    singleUser: true
    key: enum.DepartmentRewardConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.DepartmentRewardConsoleUiKey.Key:
        type: DepartmentRewardConsoleBoundUserInterface
  - type: ItemSlots
  - type: DepartmentRewardConsole
    departmentId: NT-Generic
    cardSlot:
      ejectSound: /Audio/Machines/id_swipe.ogg
      insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
      ejectOnBreak: true
      swap: false
      whitelist:
        components:
        - IdCard

- type: entity
  id: DepartmentRewardConsoleCargo
  parent: DepartmentRewardConsoleBase
  name: ent-DepartmentRewardConsoleCargo
  suffix: Cargo
  components:
  - type: DepartmentRewardConsole
    departmentId: NT-Cargo
    departmentNameLocId: department-reward-department-cargo

